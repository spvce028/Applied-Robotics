
depalletizing_main_node:
  ros__parameters:
    pick_x: 200.0
    pick_y: 0.0
    pick_z: 50.0
    pick_r: 0.0

    place_x: 250.0
    place_y: 100.0
    place_z: 50.0
    place_r: 0.0

    velocity_ratio: 0.4
    acceleration_ratio: 0.4
    movement_timeout: 30.0
    approach_height: 50.0

    # Optional flat list: [x1, y1, z1, r1, x2, y2, z2, r2, ...].
    # Units: mm/degrees, base_link. Executed with MOVL after pick, before place.
    # Empty means no extra transport moves. Configure for the actual cell.
    transport_waypoints: []

    gripper_service_name: "/dobot_gripper_service"
    gripper_timeout: 5.0
    keep_compressor_running: false

    # Conservative defaults - measure the real cell before hardware use
    workspace_x_min: -320.0
    workspace_x_max: 320.0
    workspace_y_min: -320.0
    workspace_y_max: 320.0
    workspace_z_min: -100.0
    workspace_z_max: 300.0
    workspace_r_min: -360.0
    workspace_r_max: 360.0
