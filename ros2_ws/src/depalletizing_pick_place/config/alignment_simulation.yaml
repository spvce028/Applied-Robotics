# M3 alignment example for fake servers only: mm/degrees in base_link.
# Verify physical rotation, loaded clearance and grip stability in the lab.
depalletizing_main_node:
  ros__parameters:
    pick_x: 200.0
    pick_y: 0.0
    pick_z: 50.0
    pick_r: 15.0

    place_x: 250.0
    place_y: 100.0
    place_z: 50.0
    place_r: -60.0

    velocity_ratio: 0.2
    acceleration_ratio: 0.2
    movement_timeout: 30.0
    approach_height: 50.0

    # Raise, arrive, rotate at fixed XYZ, depart, reach place approach.
    transport_waypoints: [
      200.0,   0.0, 150.0,  15.0,
      220.0,  40.0, 150.0,  15.0,
      220.0,  40.0, 150.0, -60.0,
      250.0, 100.0, 150.0, -60.0,
      250.0, 100.0, 100.0, -60.0
    ]

    gripper_service_name: /dobot_gripper_service
    gripper_timeout: 5.0
    keep_compressor_running: false

    workspace_x_min: -320.0
    workspace_x_max: 320.0
    workspace_y_min: -320.0
    workspace_y_max: 320.0
    workspace_z_min: -100.0
    workspace_z_max: 300.0
    workspace_r_min: -360.0
    workspace_r_max: 360.0